[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketo-migration"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "PyMySQL==1.1.1",
    "mysql-replication==0.46",
    "setuptools>=68",
]

[tool.setuptools.packages.find]
where = ["src"]
